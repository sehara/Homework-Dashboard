<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting Google Calendar...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4285f4;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
        .error {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2 id="status">Connecting Google Calendar...</h2>
        <p id="message">Please wait while we complete the authentication.</p>
    </div>

    <script>
        function handleCallback() {
            try {
                // Debug logging
                console.log('Full URL:', window.location.href);
                console.log('Hash:', window.location.hash);
                console.log('Search:', window.location.search);

                // Read from hash fragment (after #)
                const hash = window.location.hash.substring(1);
                const params = new URLSearchParams(hash);
                
                const accessToken = params.get('access_token');
                const expiresIn = params.get('expires_in');
                const error = params.get('error');

                if (error) {
                    throw new Error('Authorization failed: ' + error);
                }

                if (!accessToken) {
                    throw new Error('No access token received. URL hash: ' + window.location.hash);
                }

                console.log('Access token received:', accessToken.substring(0, 20) + '...');

                // Store token
                const authData = {
                    accessToken: accessToken,
                    expiresAt: Date.now() + (parseInt(expiresIn) * 1000),
                    tokenType: 'Bearer'
                };

                localStorage.setItem('googleCalendarAuth', JSON.stringify(authData));
                
                document.getElementById('status').textContent = '✅ Connected Successfully!';
                document.getElementById('message').textContent = 'Redirecting...';

                // Get user email
                fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                })
                .then(r => r.json())
                .then(data => {
                    if (data.email) localStorage.setItem('googleCalendarEmail', data.email);
                })
                .catch(err => console.log('Email fetch failed:', err))
                .finally(() => {
                    setTimeout(() => {
                        window.location.href = '/Homework-Dashboard/';
                    }, 1500);
                });

            } catch (error) {
                console.error('Callback error:', error);
                document.querySelector('.spinner').style.display = 'none';
                document.getElementById('status').textContent = '❌ Connection Failed';
                document.getElementById('message').innerHTML = `
                    <span class="error">${error.message}</span><br><br>
                    <a href="/Homework-Dashboard/" style="color: #4285f4;">Return to Dashboard</a>
                `;
            }
        }

        // Run callback handler on page load
        handleCallback();
    </script>
</body>
</html>
