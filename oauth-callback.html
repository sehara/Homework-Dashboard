<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting Google Calendar...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4285f4;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
        .error {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2 id="status">Connecting Google Calendar...</h2>
        <p id="message">Please wait while we complete the authentication.</p>
    </div>

    <script>
        const CLIENT_ID = '103319944778-o17374emsbcv16sk8f310iufr4vcgm6p.apps.googleusercontent.com';
        const CLIENT_SECRET = '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';
        const REDIRECT_URI = 'https://sehara.github.io/Homework-Dashboard/oauth-callback';

        async function handleCallback() {
            try {
                // Get authorization code from URL
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                const error = urlParams.get('error');

                if (error) {
                    throw new Error('Authorization failed: ' + error);
                }

                if (!code) {
                    throw new Error('No authorization code received');
                }

                document.getElementById('status').textContent = 'Exchanging authorization code...';

                // Exchange authorization code for access token
                const tokenResponse = await fetch('https://oauth2.googleapis.com/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        code: code,
                        client_id: CLIENT_ID,
                        client_secret: CLIENT_SECRET,
                        redirect_uri: REDIRECT_URI,
                        grant_type: 'authorization_code'
                    })
                });

                if (!tokenResponse.ok) {
                    const errorData = await tokenResponse.json();
                    throw new Error('Token exchange failed: ' + (errorData.error_description || errorData.error));
                }

                const tokenData = await tokenResponse.json();

                // Store tokens in localStorage
                const authData = {
                    accessToken: tokenData.access_token,
                    refreshToken: tokenData.refresh_token,
                    expiresAt: Date.now() + (tokenData.expires_in * 1000),
                    tokenType: tokenData.token_type
                };

                localStorage.setItem('googleCalendarAuth', JSON.stringify(authData));

                // Get user's email
                document.getElementById('status').textContent = 'Getting account info...';
                
                const userInfoResponse = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
                    headers: {
                        'Authorization': `Bearer ${tokenData.access_token}`
                    }
                });

                if (userInfoResponse.ok) {
                    const userInfo = await userInfoResponse.json();
                    localStorage.setItem('googleCalendarEmail', userInfo.email);
                }

                // Success!
                document.getElementById('status').textContent = '✅ Connected Successfully!';
                document.getElementById('message').textContent = 'Redirecting back to dashboard...';

                // Redirect back to main page after 1 second
                setTimeout(() => {
                    window.location.href = '/Homework-Dashboard/';
                }, 1000);

            } catch (error) {
                console.error('OAuth callback error:', error);
                document.querySelector('.spinner').style.display = 'none';
                document.getElementById('status').textContent = '❌ Connection Failed';
                document.getElementById('message').innerHTML = `
                    <span class="error">${error.message}</span><br><br>
                    <a href="/Homework-Dashboard/" style="color: #4285f4;">Return to Dashboard</a>
                `;
            }
        }

        // Run callback handler on page load
        handleCallback();
    </script>
</body>
</html>
